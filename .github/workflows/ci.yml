name: .NET Aspire CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET Aspire Workload
      run: dotnet workload install aspire

    - name: Display .NET version
      run: dotnet --version

    - name: Restore dependencies
      run: dotnet restore StoreApp.sln

    - name: Check code formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic || true

    - name: Build solution
      run: dotnet build StoreApp.sln --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

    - name: Run unit tests
      run: dotnet test StoreApp.API.Tests/StoreApp.API.Tests.csproj --no-build --configuration ${{ env.BUILD_CONFIGURATION }} --logger "console;verbosity=normal" --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/test-results.trx'
        retention-days: 30